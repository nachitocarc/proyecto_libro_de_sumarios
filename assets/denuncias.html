<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denuncias</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/denuncias.css">
</head>

<body>

  <button id="abrir_modal">Nueva denuncia</button>
  <button id="boton_volver" onclick="location.href='menu.html'">Volver</button>

  <div id="denuncias_contenedor">
    <h2>Denuncias</h2>

    <label for="filtro_hecho"><strong>Filtrar por hecho:</strong></label>

    <div class="filtros-grid">
      <select id="filtro_hecho">
        <option value="todos">Todos</option>
      </select>

      <input type="text" id="filtroImputado" placeholder="Filtrar por imputado...">
      <input type="text" id="filtroVictima" placeholder="Filtrar por víctima...">
      <input type="date" id="filtroFecha">
    </div>

    <div id="denuncias_lista"></div>
  </div>

  <form>
    <div id="modal" class="modal" style="display: none;">
      <div class="modal_contenido">
        <div class="modal_nombre">
          <h3>Nueva denuncia</h3>
          <span class="cerrar" id="cerrar_modal">&times;</span>
        </div>

        <label for="input_fecha">Fecha</label>
        <input type="date" id="input_fecha">

        <label for="input_lugar">Lugar</label>
        <input type="text" id="input_lugar">

        <label for="input_victima">Víctima</label>
        <input type="text" id="input_victima">

        <label for="input_imputado">Imputado</label>
        <input type="text" id="input_imputado">

        <label for="select_hechos">Hechos</label>
        <select id="select_hechos"></select>

        <label for="select_detenid o">Detenido</label>
        <select id="select_detenido">
          <option value="disabled">Seleccione una opción</option>
          <option value="Si">Sí</option>
          <option value="No">No</option>
        </select>

        <label for="select_fiscalia_juzgado">Fiscalía / Juzgado</label>
        <select id="select_fiscalia_juzgado">
          <option value="disabled">Seleccione una opción</option>
          <option value="Fiscalía">Fiscalía</option>
          <option value="Juzgado">Juzgado</option>
        </select>

        <label for="input_observaciones">Observaciones</label>
        <textarea id="input_observaciones"></textarea>

        <p>Sumariante</p>

        <input type="button" value="REGISTRAR DENUNCIA" id="registrar_denuncia" onclick="registrarDenuncia()">
      </div>
    </div>

    <div id="modal_elevacion" class="modal" style="display:none;">
      <div class="modal_contenido">
        <h3>Elevar denuncia</h3>
        <input type="date" id="fecha_elevacion">
        <button onclick="confirmarElevacion()">Confirmar</button>
        <button onclick="cerrarModalElevacion()">Cancelar</button>
      </div>
    </div>
  </form>

  <script src="../js/denuncias.js" defer></script>
</body>

</html>
